services:
  - type: web
    name: champagne-atlas-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ADMIN_USERNAME
        value: wsoet
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: werner.soeteman@gmail.com
      - key: DATABASE_URL
        fromDatabase:
          name: champagne-atlas-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: RESET_EMAIL_FROM
        value: Champagne Atlas <onboarding@resend.dev>

databases:
  - name: champagne-atlas-db
    plan: free
